[package]
name = "hermit-wasm"
version = "0.1.0"
edition = "2021"
description = "Hermit's kernel in the browser: devices, a hostile relay and a witness"
license = "MIT"
repository = "https://github.com/dakewamama/hermit"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hermit-kernel = { path = "../hermit-kernel" }
anyhow.workspace = true
serde.workspace = true
hex.workspace = true
serde_json = "1"
wasm-bindgen = "=0.2.100"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
