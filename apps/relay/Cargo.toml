[package]
name = "hermit-relay"
version = "0.1.0"
edition = "2021"
description = "Untrusted blob relay for hermit capsules, with switchable hostile modes"

[dependencies]
anyhow.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net"] }
clap = { version = "4", features = ["derive"] }
