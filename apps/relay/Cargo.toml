[package]
name = "hermit-relay"
version = "0.1.0"
edition = "2021"
description = "Untrusted blob relay for hermit capsules, with switchable hostile modes"
license = "MIT"
repository = "https://github.com/dakewamama/hermit"

[dependencies]
anyhow.workspace = true
hermit-kernel = { path = "../../crates/hermit-kernel" }
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "io-util"] }
clap = { version = "4", features = ["derive", "env"] }
