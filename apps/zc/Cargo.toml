[package]
name = "zc"
version = "0.1.0"
edition = "2021"
description = "Zcash Continuity CLI"

[dependencies]
zc-kernel = { path = "../../crates/kernel" }
anyhow.workspace = true
serde.workspace = true
hex.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
ciborium.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "eb38d7a373661179dbc083a2fd58b3a6c9b25818", default-features = false, features = ["lightwalletd-tonic-tls-webpki-roots"] }
